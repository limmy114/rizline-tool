<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>律动轨迹工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            color: #222222;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            perspective: 1200px;
        }
        :root{
            --bubble-bg: rgba(41,98,255,0.12);
            --bubble-border: rgba(41,98,255,0.07);
        }
        .bubble-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .bubble, .new-bubble {
            position: absolute; border-radius: 50%;
            background: var(--bubble-bg);
            border: 1px solid var(--bubble-border);
            transition: background 0.42s ease, border-color 0.42s ease;
        }
        .bubble-1 { width: 260px; height: 260px; top: 8%; left: 5%; }
        .bubble-2 { width: 180px; height: 180px; top: 60%; left: 12%; }
        .bubble-3 { width: 320px; height: 320px; top: 18%; right: 8%; }
        .bubble-4 { width: 140px; height: 140px; bottom: 12%; right: 15%; }
        .bubble-5 { width: 200px; height: 200px; bottom: 8%; left: 30%; }
        .bubble-6 { width: 220px; height: 220px; top: 40%; left: 45%; }
        .bubble-7 { width: 160px; height: 160px; top: 10%; left: 60%; }
        @keyframes bubbleWander {
            0% { transform: translate(0,0); }
            20% { transform: translate(40px,-30px); }
            40% { transform: translate(-30px,-50px); }
            60% { transform: translate(-50px,20px); }
            80% { transform: translate(20px,40px); }
            100% { transform: translate(0,0); }
        }
        .bubble { animation: bubbleWander 10s infinite ease-in-out; }
        .bubble-1 { animation-delay: 0s; }
        .bubble-2 { animation-delay: 1.2s; }
        .bubble-3 { animation-delay: 2.4s; }
        .bubble-4 { animation-delay: 3.6s; }
        .bubble-5 { animation-delay: 4.8s; }
        .bubble-6 { animation-delay: 6s; }
        .bubble-7 { animation-delay: 7.2s; }
        @keyframes newBubblePop {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            60% { transform: translateY(-8vh) scale(1.15); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .new-bubble {
            animation: newBubblePop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       bubbleWander 10s infinite ease-in-out 0.55s;
        }
        .page-container {
            position: fixed; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10;
        }
        .scale-out{
            animation: scaleOut 0.6s ease forwards;
        }
        .scale-in{
            animation: scaleIn 0.6s ease forwards;
        }
        @keyframes scaleOut {
            0%{transform:scale(1);opacity:1;}
            100%{transform:scale(1.3);opacity:0;}
        }
        @keyframes scaleIn {
            0%{transform:scale(0.75);opacity:0;}
            100%{transform:scale(1);opacity:1;}
        }
        .title {
            font-size: 32px; font-weight: 600; letter-spacing: 2px;
            color: #222; z-index: 25; position: relative; margin-bottom: 60px;
        }
        .home-carousel-wrap {
            position: relative; width: 340px; height: 340px;
            overflow: hidden; margin: 0 auto;
        }
        .round-btn {
            position: absolute; left: 0; top: 0;
            width: 340px; height: 340px; border-radius: 50%;
            border: none; color: #ffffff; font-size: 28px; cursor: pointer;
            transition: transform 0.42s ease-in, opacity 0.42s ease;
            pointer-events: none;
        }
        .round-btn.center { transform: translateX(0); opacity: 1; pointer-events: auto; }
        .round-btn.from-left { transform: translateX(-100%); opacity: 0; }
        .round-btn.from-right { transform: translateX(100%); opacity: 0; }
        .round-btn.hide-left { transform: translateX(-100%); opacity: 0; }
        .round-btn.hide-right { transform: translateX(100%); opacity: 0; }
        .round-btn:active { transform: scale(0.94); }

        .tool-carousel-wrap {
            position: relative; width:300px;height:300px;
            overflow:hidden;margin:0 auto;
        }
        .tool-round-btn{
            position:absolute;left:0;top:0;
            width:300px;height:300px;border-radius:50%;
            border:none;color:#fff;font-size:24px;cursor:pointer;
            transition: transform 0.42s ease-in, opacity 0.42s ease;
            pointer-events:none;
        }
        .tool-round-btn.center{transform:translateX(0);opacity:1;pointer-events:auto;}
        .tool-round-btn.from-left{transform:translateX(-100%);opacity:0;}
        .tool-round-btn.from-right{transform:translateX(100%);opacity:0;}
        .tool-round-btn.hide-left{transform:translateX(-100%);opacity:0;}
        .tool-round-btn.hide-right{transform:translateX(100%);opacity:0;}
        .tool-round-btn:active{transform:scale(0.94);}

        .progress-dots,
        .tool-progress-dots {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            align-items: center;
            justify-content: center;
            gap: 24px;
            z-index: 20;
        }
        .progress-dots.show { display: flex; }
        .tool-progress-dots.show { display: flex; }

        .dot {
            border-radius: 50%;
            background: #333333;
            width: 12px;
            height: 12px;
            transition: width 0.42s ease, height 0.42s ease;
        }
        .dot.large { width: 20px; height: 20px; }
        .dot.small { width: 12px; height: 12px; }

        .back-circle-btn{
            position: fixed;
            left:24px;
            bottom:36px;
            width:52px;
            height:52px;
            border-radius:50%;
            background:#2962ff;
            border:none;
            color:#fff;
            font-size:15px;
            cursor:pointer;
            z-index:30;
        }
        .back-circle-btn:active{transform:scale(0.92);}

        .view {
            display: none; text-align: center; width: 100%; height: 100%;
            padding: 20px; overflow-y: auto;
        }
        .view.active { display: block; }
        #viewHome {
            touch-action: manipulation;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #viewHome.active { display: flex; }
        #viewHome .title { margin-bottom: 48px; }
        #viewTool{
            touch-action: manipulation;
            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        #viewTool.active{display:flex;}
        #viewTool .title{margin-bottom:40px;font-size:26px;}

        .calc-card {
            max-width: 420px; margin: 0 auto; margin-top: 10px;
            padding: 24px; background: #f7f8fa; border-radius: 16px;
        }
        .calc-card h2 { font-size: 20px; margin-bottom: 16px; }
        .form-item { text-align: left; margin-bottom: 12px; position:relative; }
        .form-item label { display: block; margin-bottom: 4px; font-size: 14px; }
        .form-item input, .form-item select, .form-item button {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 8px; font-size: 15px;
        }
        select:disabled { background: #eeeeee; cursor: not-allowed; }
        .calc-btn {
            width: 100%; padding: 12px; background: #2962ff; color: white;
            border: none; border-radius: 8px; margin-top: 8px; font-size: 16px; cursor: pointer;
        }
        .result-area {
            margin-top: 16px; background: #fff; padding: 12px;
            border-radius: 8px; text-align: left; font-size: 14px; line-height: 1.8;
            white-space: pre-wrap;
        }
        .tip-note { margin-top: 8px; font-size: 12px; color: #777; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            z-index: 100; display: flex; align-items: center; justify-content: center;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: #fff; border-radius: 14px; width: 82%;
            max-width: 340px; padding: 20px;
        }
        .modal-box h3 { text-align: center; margin-bottom: 16px; }
        .part-btn {
            width: 100%; padding: 11px; margin: 6px 0; border-radius: 8px;
            border: 1px solid #bbb; background: #f3f4f6; font-size: 15px; cursor: pointer;
        }
        .song-suggest-wrap{
            position:absolute;
            left:0;right:0;top:calc(100% + 4px);
            background:#fff;
            border:1px solid #ccc;
            border-radius:8px;
            max-height:180px;
            overflow-y:auto;
            z-index:200;
            box-shadow:0 2px 8px #00000018;
        }
        .song-suggest-item{
            padding:9px 12px;
            cursor:pointer;
            text-align:left;
        }
        .song-suggest-item:hover{
            background:#e8f0ff;
        }
        @media (max-width: 480px) {
            .title { font-size: 24px; margin-bottom: 40px; }
            .home-carousel-wrap { width: 280px; height: 280px; }
            .round-btn { width: 280px; height: 280px; font-size: 24px; }
            .tool-carousel-wrap{width:260px;height:260px;}
            .tool-round-btn{width:260px;height:260px;font-size:20px;}
            #viewHome .title { margin-bottom: 36px; }

            .bubble-3 { width: 230px; height: 230px; }

            .progress-dots, .tool-progress-dots { bottom: 28px; gap: 20px; }

            .dot.small { width: 10px; height: 10px; }
            .calc-card { padding: 16px; }
            .back-circle-btn{width:46px;height:46px;left:16px;bottom:28px;}
        }
    </style>
</head>

function renderSuggest(list){
    if(!list || list.length ===0){
        songSuggestWrap.style.display = "none";
        return;
    }
    songSuggestWrap.innerHTML = "";
    list.forEach(song=>{
        const div = document.createElement('div');
        div.className = "song-suggest-item";
        div.textContent = song.name;
        div.onclick = ()=>{
            songSearchInput.value = song.name;
            selectedSongItem = song;
            songSuggestWrap.style.display = "none";
        }
        songSuggestWrap.appendChild(div);
    })
    songSuggestWrap.style.display = "block";
}
songSearchInput.addEventListener('input',()=>{
    const kw = songSearchInput.value.trim().toLowerCase();
    if(kw.length ===0){
        songSuggestWrap.style.display = "none";
        return;
    }
    const match = songAllData.filter(s=> s.name.toLowerCase().includes(kw));
    renderSuggest(match.slice(0,8));
});

function setBubbleTheme(mode){
    switch(mode){
        case "EZ":
            document.documentElement.style.setProperty('--bubble-bg', 'rgba(80, 190, 100, 0.11)');
            document.documentElement.style.setProperty('--bubble-border', 'rgba(80, 190, 100, 0.06)');
            break;
        case "HD":
            document.documentElement.style.setProperty('--bubble-bg', 'rgba(255,200,60,0.12)');
            document.documentElement.style.setProperty('--bubble-border', 'rgba(255,200,60,0.07)');
            break;
        case "IN":
            document.documentElement.style.setProperty('--bubble-bg', 'rgba(230,80,80,0.11)');
            document.documentElement.style.setProperty('--bubble-border', 'rgba(230,80,80,0.06)');
            break;
        case "AT":
            document.documentElement.style.setProperty('--bubble-bg', 'rgba(140,80,180,0.11)');
            document.documentElement.style.setProperty('--bubble-border', 'rgba(140,80,180,0.06)');

function switchCarousel(direction){
    if(isAnimating) return;
    isAnimating = true;
    const oldIdx = currentBtnIndex;
    currentBtnIndex = currentBtnIndex === 0 ? 1 : 0;
    const newIdx = currentBtnIndex;
    const oldBtn = roundBtns[oldIdx];
    const newBtn = roundBtns[newIdx];
    if(oldIdx === 0){
        oldBtn.className = "round-btn hide-left";
        newBtn.className = "round-btn from-right";
        void newBtn.offsetWidth;
        newBtn.className = "round-btn center";
    }else{
        oldBtn.className = "round-btn hide-right";
        newBtn.className = "round-btn from-left";
        void newBtn.offsetWidth;
        newBtn.className = "round-btn center";
    }
    updateDots(newIdx);
    setHomeBubble(newIdx);
    setTimeout(()=>{ isAnimating = false; },420);
}
function switchToolCarousel(dir){
    if(toolAnimating) return;
    toolAnimating = true;
    const old = toolIndex;
    if(dir === "left") toolIndex = toolIndex -1 <0 ? 2 : toolIndex -1;
    else toolIndex = toolIndex +1 >2 ?0 : toolIndex +1;
    const oldBtn = toolBtns[old];
    const newBtn = toolBtns[toolIndex];
    if(dir === "left"){
        oldBtn.className = "tool-round-btn hide-right";
        newBtn.className = "tool-round-btn from-left";
    }else{
        oldBtn.className = "tool-round-btn hide-left";
        newBtn.className = "tool-round-btn from-right";
    }
    void newBtn.offsetWidth;
    newBtn.className = "tool-round-btn center";
    setToolBubble(toolIndex);
    updateToolDots(toolIndex);
    setTimeout(()=>{ toolAnimating = false; },420);
}

viewHome.addEventListener('touchend',e=>{
    if(isAnimating||!viewHome.classList.contains('active')) return;
    const endX = e.changedTouches[0].clientX;
    const diff = endX - touchStartX;
    if(Math.abs(diff) > 45){

        else switchCarousel("left");

},{passive:true});

async function triggerRush(toView, pushStack=true){
    return new Promise(resolve=>{
        const activePage = document.querySelector('.view.active');
        activePage.classList.add('scale-out');
        setTimeout(()=>{
            clearAllView();
            activePage.classList.remove('scale-out');
            toView.classList.add('active');
            if(pushStack) viewStack.push(toView.id);
            setPageIndicators(toView);
            if(toView === viewHome){
                globalBackBtn.style.display = "none";
                clearTempBubbles();
                setHomeBubble(currentBtnIndex);
            }else if(toView === viewTool){
                globalBackBtn.style.display = "block";
                spawnNewBubbles(3);
                toolIndex =0; setToolBubble(0); updateToolDots(0);
                toolBtns.forEach((btn,i)=>{
                    if(i===0) btn.className="tool-round-btn center";
                    else btn.className="tool-round-btn from-right";
                })
            }else{
                globalBackBtn.style.display = "block";
                spawnNewBubbles(3);
            }
            if(toView === viewCalc){ setBubbleTheme(diffSelectCalc.value); }
            if(toView === viewChart || toView === viewRandom || toView === viewRecommend){
                document.documentElement.style.setProperty('--bubble-bg', 'rgba(41, 98, 255, 0.12)');
                document.documentElement.style.setProperty('--bubble-border', 'rgba(41, 98, 255, 0.07)');
            }
            toView.classList.add('scale-in');
            setTimeout(()=>{ toView.classList.remove('scale-in'); resolve(); },600);
        },600);
    })
}
async function goBack(){
    viewStack.pop();
    const prevId = viewStack[viewStack.length -1];
    let prevView;
    switch(prevId){
        case "viewHome": prevView=viewHome;break;
        case "viewTool": prevView=viewTool;break;
        case "viewCalc": prevView=viewCalc;break;
        case "viewChart": prevView=viewChart;break;
        case "viewRandom": prevView=viewTool;break;
        case "viewRecommend": prevView=viewTool;break;
        default: prevView=viewHome;
    }
    await triggerRush(prevView,false);
}

function getAccRks(acc){
    if(acc<60) return 0;
    if(acc<70) return 1.5;
    if(acc<80) return 3;
    if(acc<90) return 4.5;
    if(acc<95) return 6;
    if(acc<100) return 6.75;
    if(acc<105) return 7.5;
    if(acc<110) return 8.25;
    if(acc<112) return 9;
    if(acc<114) return 9.3;
    if(acc<116) return 9.6;
    if(acc<118) return 9.9;
    if(acc<120) return 10.2;
    return 10.5;
}
function calcHH(mH, diff){
    let K;
    if(diff === "EZ") K = 0.5;
    else if(diff === "HD") K = 0.9;
    else K = 0.98;
    if((1-K) * mH > 5){
        return Math.ceil(K * mH);
    }else{
        return mH - 5;
    }
}

queryChartBtn.addEventListener('click', () => {
    const diff = diffSelectChart.value;
    const idx = Number(levelSelectChart.value);
    if(!currentSelectedPart){
        chartResultBox.innerText = "请先选择歌曲分区！";
        return;
    }
    const song = songAllData[idx];
    const diffObj = song[diff];
    if(!diffObj){
        chartResultBox.innerText = "该歌曲没有此难度！";
        return;
    }
    const hH = calcHH(diffObj.mH, diff);
    chartResultBox.innerText = 
`曲名：${song.name}
难度：${diff}
定数 C：${diffObj.c.toFixed(2)}
Riztime 总 Hit (mH)：${diffObj.mH}
全谱总 Note (mHit)：${diffObj.mHit}
hH：${hH}`;
});

calcBtn.addEventListener('click',()=>{
    const diff = diffSelectCalc.value;
    const Hit = Number(inputHit.value);
    const acc = Number(inputAcc.value);
    const Score = Number(inputScore.value);

    if(!selectedSongItem){
        resultBox.innerText = "请搜索并点击候选选择一首歌曲！";
        return;
    }
    const diffObj = selectedSongItem[diff];
    if(!diffObj){
        resultBox.innerText = "该歌曲没有此难度！";
        return;
    }
    const { c: C, mH, mHit } = diffObj;

    if(isNaN(Hit)||isNaN(acc)||isNaN(Score)){
        resultBox.innerText = "请填写完整数据";
        return;
    }
    if(mH <= 0 || mHit <= 0){
        resultBox.innerText = "⚠️该歌曲谱面数据缺失";
        return;
    }
    if(Hit > mHit){
        resultBox.innerText = "Hit数不能大于总Note数";
        return;
    }

    const hH = calcHH(mH, diff);
    const accrks = getAccRks(acc);

    let hitrks;
    if(Hit <= mHit / 2){
        hitrks = 0;
    }else{
        hitrks = 10 * C * (2*Hit - mHit)/mHit;
    }

    const baseScore = (Hit / mHit) * 1000000;
    const mP = (Score - baseScore) / 100;

    if(mP < 0){
        resultBox.innerText = "结算分过低，请检查数据";
        return;
    }
    if(mP > mH){
        resultBox.innerText = "mP超过上限，请检查数据";
        return;
    }

    const rizrks = C * Math.min(mP, hH) / hH;
    const totalRks = accrks + hitrks + rizrks;
    const maxTotalRks = 10.5 + 10 * C + C;
    const improveRks = (maxTotalRks - totalRks) / 40;

    resultBox.innerText = 
`${totalRks.toFixed(3)}
您当前成绩打满可提升 ${improveRks.toFixed(3)} 点RKS
理论最大RKS：${maxTotalRks.toFixed(3)}`;
});

function getAllValidEntries(){
    const pool = [];
    songAllData.forEach(song=>{
        ['EZ','HD','IN','AT'].forEach(diffKey=>{
            const d = song[diffKey];
            if(d && d.c !== undefined){
                pool.push({
                    songName: song.name,
                    part: song.part,
                    diff: diffKey,
                    c: d.c
                });
            }
        });
    });
    return pool;
}
refreshRandomBtn.onclick = ()=>{

    if(list.length ===0){
        randomResultBox.innerText = "暂无谱面数据";
        return;

    const entry = list[Math.floor(Math.random() * list.length)];
    randomResultBox.innerText =
`🎲 今日游玩推荐
歌曲：${entry.songName}
分区：${entry.part}
难度：${entry.diff}
定数：${entry.c.toFixed(2)}`;
};

recommendBtn.onclick = ()=>{
    const rksVal = Number(inputUserRks.value);
    if(isNaN(rksVal)){
        recommendResultBox.innerText = "请输入有效的RKS数值";
        return;
    }
    const all = getAllValidEntries();
    let candidates = [];
    if(rksVal < 10){
        candidates = all.filter(x=> x.c === 1);
    }else if(rksVal >= 160){
        candidates = all;
    }else{
        const limitC = rksVal / 10;
        candidates = all.filter(x=> x.c <= limitC);
    }
    if(candidates.length ===0){
        recommendResultBox.innerText = "没有匹配条件的谱面";
        return;
    }
    const res = candidates[Math.floor(Math.random() * candidates.length)];
    recommendResultBox.innerText =
`✨ 为你推荐
歌曲：${res.songName}
分区：${res.part}
难度：${res.diff}
定数：${res.c.toFixed(2)}`;
};
